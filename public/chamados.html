<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Chamados - Suporte TI</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 1000px; margin: 20px auto; padding: 0 12px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: left; }
    input, select, button { padding: 6px; margin: 3px 0; }
    .caixa { border: 1px solid #ccc; padding: 12px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <h1>Chamados</h1>
  <p>Usuário: <b id="usuario"></b> <button onclick="sair()">Sair</button></p>

  <div class="caixa">
    <h3>Abrir chamado</h3>
    <select id="cliente"></select>
    <select id="tipo"></select><br>
    <input id="defeito" placeholder="Defeito" size="60"><br>
    <input id="config" placeholder="Configuração da máquina" size="60"><br>
    <button onclick="abrirChamado()">Abrir chamado</button>
  </div>

  <div class="caixa">
    <h3>Atribuir técnico</h3>
    <select id="chamadoSel"></select>
    <select id="tecnico"></select><br>
    <input id="procedimento" placeholder="Procedimento" size="60"><br>
    <button onclick="atribuir()">Atribuir</button>
  </div>

  <table>
    <thead>
      <tr><th>ID</th><th>Cliente</th><th>Tipo</th><th>Defeito</th><th>Status</th><th>Técnico</th><th>Procedimento</th><th>Ação</th></tr>
    </thead>
    <tbody id="lista"></tbody>
  </table>

  <script>
    const usuario = JSON.parse(sessionStorage.getItem('usuario') || 'null');
    if (!usuario) location.href = 'login.html';
    document.getElementById('usuario').textContent = usuario ? usuario.login : '';

    const STATUS = ['ABERTO', 'EM ANDAMENTO', 'AGUARDANDO PECA', 'CONCLUIDO', 'CANCELADO'];

    function esc(t) {
      const d = document.createElement('div');
      d.textContent = t ?? '';
      return d.innerHTML;
    }

    async function api(url, metodo = 'GET', corpo) {
      const r = await fetch(url, {
        method: metodo,
        headers: { 'Content-Type': 'application/json' },
        body: corpo ? JSON.stringify(corpo) : undefined
      });
      const dados = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(dados.erro || 'Erro');
      return dados;
    }

    function preencher(id, itens) {
      document.getElementById(id).innerHTML = itens
        .map((i) => `<option value="${i.valor}">${esc(i.texto)}</option>`)
        .join('');
    }

    async function carregar() {
      const [clientes, tipos, tecnicos, chamados] = await Promise.all([
        api('/api/clientes'), api('/api/tipos'), api('/api/tecnicos'), api('/api/chamados')
      ]);

      preencher('cliente', clientes.map((c) => ({ valor: c.id_cliente, texto: c.nome })));
      preencher('tipo', tipos.map((t) => ({ valor: t.id_tipo, texto: t.descricao })));
      preencher('tecnico', tecnicos.map((t) => ({ valor: t.id_tecnico, texto: t.nome })));

      const unicos = new Map();
      chamados.forEach((c) => unicos.set(c.id_chamado, c));
      preencher('chamadoSel', [...unicos.values()].map((c) => ({
        valor: c.id_chamado, texto: `#${c.id_chamado} - ${c.defeito}`
      })));

      document.getElementById('lista').innerHTML = chamados.map((c) => `
        <tr>
          <td>${c.id_chamado}</td>
          <td>${esc(c.cliente)}</td>
          <td>${esc(c.tipo)}</td>
          <td>${esc(c.defeito)}</td>
          <td>
            <select onchange="mudarStatus(${c.id_chamado}, this.value)">
              ${STATUS.map((s) => `<option ${s === c.status_solucao ? 'selected' : ''}>${s}</option>`).join('')}
            </select>
          </td>
          <td>${esc(c.tecnico) || '-'}</td>
          <td>${esc(c.procedimento) || '-'}</td>
          <td><button onclick="excluir(${c.id_chamado})">Excluir</button></td>
        </tr>`).join('');
    }

    async function abrirChamado() {
      try {
        await api('/api/chamados', 'POST', {
          id_cliente: document.getElementById('cliente').value,
          id_tipo: document.getElementById('tipo').value,
          defeito: document.getElementById('defeito').value,
          configuracao_maquina: document.getElementById('config').value
        });
        document.getElementById('defeito').value = '';
        document.getElementById('config').value = '';
        carregar();
      } catch (e) { alert(e.message); }
    }

    async function atribuir() {
      try {
        await api('/api/chamados/atendimentos', 'POST', {
          id_chamado: document.getElementById('chamadoSel').value,
          id_tecnico: document.getElementById('tecnico').value,
          procedimento: document.getElementById('procedimento').value
        });
        document.getElementById('procedimento').value = '';
        carregar();
      } catch (e) { alert(e.message); }
    }

    async function mudarStatus(id, status) {
      await api(`/api/chamados/${id}/status`, 'PUT', { status });
      carregar();
    }
    
    async function excluir(id) {
  if (!confirm('Excluir o chamado ' + id + '?')) return;
  try {
    await api('/api/chamados/' + id, 'DELETE');
    carregar();
  } catch (e) { alert(e.message); }
}

    function sair() {
      sessionStorage.removeItem('usuario');
      location.href = 'login.html';
    }

    if (usuario) carregar();
  </script>
</body>
</html>
